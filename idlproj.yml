# Fossify Messages for iOS. Build with `idl build -c release` (see README.md).
toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin
  swiftc: swiftc
  ldid: ldid
  actool: idl-actool

targets:
  - name: FossifyMessages
    bundle_id: org.fossify.messages.ios
    version: "1.10.3"
    build_number: "1"
    min_ios: "17.0"
    device_family: "1,2"
    link: [MessagesKit, FossifyCommons]
    sources: [App]
    resources: [Resources/Assets.xcassets]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, ContactsUI, MessageUI, PhotosUI, QuickLook, AVFoundation, UserNotifications, UniformTypeIdentifiers, LocalAuthentication]
    swift_version: "5.0"
    info:
      CFBundleDisplayName: Messages
      NSContactsUsageDescription: Messages shows the names and photos of your contacts and lets you pick recipients.
      NSCameraUsageDescription: Take photos and videos to send as attachments.
      NSMicrophoneUsageDescription: Record audio and videos to send as attachments.
      NSPhotoLibraryUsageDescription: Choose photos and videos to send as attachments.
      NSFaceIDUsageDescription: Unlock the app when password protection uses Face ID.
      UIFileSharingEnabled: true
      LSSupportsOpeningDocumentsInPlace: true
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      CFBundleDocumentTypes:
        - CFBundleTypeName: Messages backup
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.json, public.xml]
    configurations:
      debug:
        entitlements:
          get-task-allow: true

  # Everything but the app entry point; also linked by the launcher (fossify-ios/launcher-ios).
  - name: MessagesKit
    type: static
    min_ios: "17.0"
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, ContactsUI, MessageUI, PhotosUI, QuickLook, AVFoundation, UserNotifications, UniformTypeIdentifiers, LocalAuthentication]
    swift_version: "5.0"

  # Shared core (fossify-ios/commons-ios), compiled into the app as a static Swift module.
  - name: FossifyCommons
    type: static
    dir: ../commons-ios
    min_ios: "17.0"
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]
    swift_version: "5.0"
